<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TH10 Game</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; color: #fff; }
        canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        /* The 640x480 loading screen, scaled like the game canvas. */
        #boot { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #000; cursor: default; }
        #boot.ready { cursor: pointer; }
        #frame { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
        #loading { position: absolute; inset: 0; width: 100%; height: 100%; }
        #boot-text, #start { position: absolute; left: 2.5%; font: 13px/1.4 "MS PGothic", "Yu Gothic", "Noto Sans CJK JP", sans-serif; color: #fff; text-shadow: 1px 1px 0 #000, 0 0 4px #000; letter-spacing: .04em; }
        #boot-text { bottom: 3%; opacity: .55; font-size: 11px; }
        #start { bottom: 7%; padding: 0; border: 0; background: none; cursor: pointer; animation: blink 1.4s ease-in-out infinite; }
        #start:disabled { visibility: hidden; animation: none; }
        #start:focus-visible { outline: 1px solid #fff8; outline-offset: 4px; }
        #boot-note { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        @keyframes blink { 50% { opacity: .35; } }
        @media (prefers-reduced-motion: reduce) { #start { animation: none; } }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<div id="boot"><div id="frame">
    <canvas id="loading" width="640" height="480" aria-hidden="true"></canvas>
    <button id="start" type="button" disabled>点击画面或按 Z 键开始</button>
    <span id="boot-text" aria-live="polite">等待游戏下载</span>
    <small id="boot-note">下载与存储初始化后，可先导入原作文件。</small>
</div></div>
<script src="wasm_exec.js"></script>
<script type="module" src="loading.mjs"></script>
<script type="module" src="player.mjs"></script>
</body>
</html>
